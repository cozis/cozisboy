image sdcard.img {
	# Allwinner boot ROM loads the SPL from 8 KiB into the card
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K # 1MB - 8KB(offset) - 16KB(GPT)
	}

	# Fast-boot FIT (TF-A + trampoline + Linux + DT), loaded by the SPL
	# instead of U-Boot unless the Menu button is held at power-on.
	partition fastboot {
		in-partition-table = false
		image = "fastboot.itb"
		offset = 1M
		size = 31M
	}

	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1008K # keep the GPT clear of the SPL at 8K
		gpt-no-backup = true
	}

	partition rootfs {
		offset = 32M
		image = "rootfs.ext4"
		partition-uuid = %PARTUUID%
		bootable = true
	}

	partition data {
		image = "data.ext4"
	}
}
