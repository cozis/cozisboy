<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cozisboy</title>
<link rel="icon" href="/favicon.png">
<script src="/font5x7.js"></script>
<script src="/pixel.js"></script>
<!--
	cozisboy web app. Design from apps/web/mock (console views): flat colours
	only (no shadows, glows, gradients or blur), the launcher's 5x7 pixel font
	for headings and buttons, regular type for everything you read.
-->
<style>
:root {
	--red: #ff4a4a; --orange: #ff9a2e; --yellow: #ffd93d; --green: #59d65a;
	--cyan: #3dc6ff; --blue: #6a7dff; --purple: #c56bff; --pink: #ff6bc1;
	--sys-gb: var(--green); --sys-gbc: var(--purple); --sys-gba: var(--blue);
	--page: #0b0b0d; --frame: #101012; --bar: #17171a; --side: #141417; --tool: #121215;
	--line: #26262b; --field: #1c1c20; --chip: #232327;
	--text: #ffffff; --dim: #b0b0b8; --faint: #77777f; --fainter: #66666e;
}
* { box-sizing: border-box; }
*, *::before, *::after { box-shadow: none; text-shadow: none; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
img.pix { image-rendering: pixelated; }
.hidden { display: none !important; }
.px { line-height: 0; }

/* ---- buttons */
.pb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: #000; border: 0; padding: 11px 16px; cursor: pointer; white-space: nowrap; text-decoration: none; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; }
.pb:hover { filter: brightness(1.08); }
.pb:active { filter: brightness(.92); }
.pb:disabled { opacity: .45; cursor: default; filter: none; }
.pb.go { background: var(--yellow); }
.pb.dim { background: #2a2a2e; }
.pb.red { background: var(--red); }
.pb.small { padding: 8px 12px; }
.pb .px svg g:last-child { fill: #000; }
.pb.dim .px svg g:last-child { fill: #d0d0d6; }
.pb.red .px svg g:last-child { fill: #fff; }
/* hold to confirm: a flat bar fills while pressed */
.pb.hold { touch-action: none; -webkit-touch-callout: none; }
.pb.hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0,0,0,.28); pointer-events: none; }
.pb.hold.holding .fill { width: 100%; transition: width 1s linear; }
.pb.hold > .px { position: relative; }

/* ---- shell */
.wrap { padding: 24px; display: flow-root; }
.shell { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 64px 1fr; max-width: 1280px; height: calc(100vh - 48px); margin: 0 auto; border: 2px solid var(--line); background: var(--frame); overflow: hidden; }
.hd { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--bar); border-bottom: 2px solid var(--line); }
.hd .logo { height: 30px; cursor: pointer; }
.hd .grow { flex: 1; }
.hd .stat { display: flex; gap: 18px; align-items: center; }
.hd .wifi { color: var(--faint); font-size: 13px; }
.hd .bat { display: inline-flex; align-items: center; gap: 8px; }
.hd .bat i { display: inline-block; width: 22px; height: 11px; border: 2px solid #9a9aa4; position: relative; }
.hd .bat i::after { content: ""; position: absolute; right: -5px; top: 2px; width: 2px; height: 3px; background: #9a9aa4; }
.hd .bat i b { position: absolute; left: 1px; top: 1px; bottom: 1px; background: var(--green); }
.snav { background: var(--side); border-right: 2px solid var(--line); overflow-y: auto; padding: 18px 0 18px; display: flex; flex-direction: column; }
.snav .lbl { padding: 16px 22px 8px; }
.snav button.f { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; border-left: 4px solid transparent; padding: 10px 18px; cursor: pointer; text-align: left; color: var(--dim); font-weight: 600; }
.snav button.f:hover { background: #ffffff08; }
.snav button.f.on { background: #ffffff0f; border-left-color: var(--c, var(--yellow)); color: #fff; }
.snav .dot { width: 10px; height: 10px; background: var(--c); flex: none; }
.snav .n { margin-left: auto; color: var(--fainter); font-weight: 500; }
.snav .spacer { flex: 1; min-height: 20px; }
.snav .meter { padding: 6px 22px 4px; }
.snav .track { height: 8px; background: var(--line); margin: 8px 0 6px; }
.snav .track i { display: block; height: 100%; background: var(--purple); }
.snav small { color: var(--faint); font-size: 12px; }
.snav .links { padding: 14px 22px 0; display: flex; flex-direction: column; gap: 8px; }
.snav .links a { color: var(--faint); font-size: 13px; cursor: pointer; text-decoration: none; }
.snav .links a:hover { color: #fff; }
.mn { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.tb { display: flex; gap: 14px; align-items: center; padding: 16px 28px; border-bottom: 2px solid var(--line); background: var(--tool); }
.tb .grow { flex: 1; }
.search { flex: 1; min-width: 160px; max-width: 560px; background: var(--field); border: 0; outline: 2px solid transparent; color: #fff; padding: 11px 14px; font-weight: 600; }
.search:focus { outline-color: var(--yellow); }
.ct { overflow-y: auto; padding: 4px 28px 60px; }

/* ---- sections + cover grid */
.sech { display: flex; align-items: center; gap: 14px; margin: 28px 0 16px; }
.sech .ln { flex: 1; height: 2px; background: var(--line); }
.seeall { color: #9a9aa4; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seeall:hover { color: #fff; }
.cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 20px; }
.cg.one-row { grid-template-rows: auto; grid-auto-rows: 0; overflow: hidden; row-gap: 0; }
.it { cursor: pointer; outline: none; min-width: 0; }
.fr { aspect-ratio: 1; background: #000; position: relative; overflow: hidden; outline: 2px solid transparent; outline-offset: 3px; }
.it:hover .fr, .it:focus-visible .fr { outline-color: #fff; }
.fr img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fr.shot img { image-rendering: pixelated; }
.fr .ph { width: 100%; height: 100%; display: grid; place-items: center; background: var(--c); }
.fr .tg { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 5px; }
.fr .tg span { background: #000; padding: 4px 6px; }
.fr .tg span.ok { background: var(--green); }
.fr .act { position: absolute; right: 8px; bottom: 8px; opacity: 0; }
.it:hover .fr .act, .it:focus-within .fr .act { opacity: 1; }
.it .nm { margin-top: 12px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it .sb { color: #8a8a94; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--faint); padding: 40px 0; }
.empty .pb { margin-top: 16px; }

/* ---- game view (carousel) */
.cv { position: fixed; inset: 0; background: var(--page); overflow: hidden; z-index: 5; }
.cv .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 20px; padding: 22px 34px; z-index: 3; }
.cv .top .logo { height: 30px; cursor: pointer; }
.cv .top .grow { flex: 1; }
.cv .count { position: absolute; left: 50%; transform: translateX(-50%); top: calc(11vh - 14px); z-index: 3; }
.cv .stage { position: absolute; left: 0; right: 0; top: 11vh; height: 320px; z-index: 2; }
.cov { position: absolute; top: 50%; left: 50%; width: 290px; height: 290px; margin: -145px 0 0 -145px; cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.cov .box { width: 100%; height: 100%; background: #000; overflow: hidden; display: grid; place-items: center; }
.cov.sel .box { outline: 3px solid #fff; outline-offset: 4px; }
.cov img { width: 100%; height: 100%; object-fit: cover; }
.cov .ph { width: 100%; height: 100%; display: grid; place-items: center; background: var(--c); }
.cv .info { position: absolute; left: 0; right: 0; top: calc(11vh + 345px); bottom: 70px; text-align: center; z-index: 2; padding: 0 20px; overflow-y: auto; }
.cv .info .t { display: flex; justify-content: center; min-height: 40px; }
.cv .info .s { margin-top: 10px; color: #cfcfd6; }
.cv .acts { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.cv .panel { max-width: 860px; margin: 26px auto 0; text-align: left; }
.states { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.st { width: 210px; }
.st .im { aspect-ratio: 3/2; background: #000; cursor: zoom-in; }
.st .im img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.st b { display: block; margin-top: 8px; font-size: 14px; }
.st span { color: #9a9aa4; font-size: 12px; display: block; margin-bottom: 8px; }
.st .row { display: flex; gap: 8px; }
.more { display: flex; flex-direction: column; gap: 2px; max-width: 560px; margin: 0 auto; }
.more .mi { display: flex; align-items: center; gap: 12px; background: var(--side); padding: 12px 16px; }
.more .mi .grow { flex: 1; color: var(--dim); font-size: 14px; }
.more input { flex: 1; background: var(--field); border: 0; outline: 2px solid transparent; color: #fff; padding: 9px 12px; }
.more input:focus { outline-color: var(--yellow); }
.cv .hints { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; gap: 26px; justify-content: center; z-index: 3; flex-wrap: wrap; }
.hint { display: flex; gap: 8px; align-items: center; cursor: default; }
.key { background: #ddd; padding: 3px 7px; }
.key.y { background: var(--yellow); }

/* ---- add games popup */
.modal-bg { position: fixed; inset: 0; z-index: 25; background: var(--page); display: grid; place-items: center; }
.modal-bg.anim, .modal.anim { animation: fadein .15s ease-out; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(1120px, 94vw); height: min(760px, 88vh); background: #131316; outline: 2px solid var(--line); display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr; overflow: hidden; }
.modal .mh { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: var(--bar); }
.modal .mh .pb { margin-left: auto; }
.modal .side { padding: 14px 0; background: #101013; overflow-y: auto; }
.modal .side button { display: flex; gap: 12px; align-items: center; width: 100%; background: transparent; border: 0; border-left: 5px solid transparent; padding: 12px 18px; cursor: pointer; text-align: left; }
.modal .side button:hover { background: #ffffff08; }
.modal .side button.on { background: #ffffff10; border-left-color: var(--c); }
.modal .side .ic { width: 34px; height: 34px; display: grid; place-items: center; background: var(--c); flex: none; }
.modal .side small { display: block; color: var(--faint); font-size: 12px; margin-top: 3px; }
.modal .body { overflow-y: auto; padding: 22px 26px 30px; }
.modal .cg { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 22px 16px; }
.ctl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; }
.chip { background: var(--chip); border: 0; padding: 8px 12px; cursor: pointer; }
.chip.on { background: #fff; }
.dropzone { border: 3px dashed #3a3a40; padding: 70px 20px; text-align: center; }
.dropzone p { color: #9a9aa4; margin: 14px 0 22px; }
.note { margin: 16px 0 0; color: #9a9aa4; font-size: 14px; max-width: 70ch; }
.hhd { display: grid; grid-template-columns: 300px 1fr; gap: 26px; }
.hhd .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.hhd .shots img { width: 100%; aspect-ratio: 10/9; object-fit: cover; image-rendering: pixelated; background: #000; }
.hhd .shots img:first-child { grid-column: 1 / -1; aspect-ratio: auto; }
.hhd .desc { color: #c9c9d1; font-size: 14px; margin: 14px 0; max-height: 260px; overflow-y: auto; white-space: pre-wrap; }
.linkrow { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.linkrow .search { max-width: none; }
.loading { color: var(--faint); padding: 30px 0; }
.cg > .loading, .cg > .note { grid-column: 1 / -1; }

/* ---- uploads tray */
.tray { position: fixed; right: 22px; bottom: 22px; width: 380px; max-width: calc(100vw - 44px); z-index: 30; background: #1a1a1e; outline: 2px solid var(--line); padding: 16px 18px; max-height: 50vh; overflow-y: auto; }
.tray .th { display: flex; justify-content: space-between; align-items: center; }
.tray .th a { color: #888; cursor: pointer; }
.tray .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13px; }
.tray .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tray .row span:last-child { color: #9a9aa4; white-space: nowrap; }
.tray .row.bad span:last-child { color: var(--red); white-space: normal; text-align: right; }
.segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 6px; }
.segs i { height: 8px; background: #2a2a2e; }
.segs i.on { background: var(--c); }

/* ---- drop overlay, zoom, toast */
.drop { position: fixed; inset: 0; z-index: 40; background: var(--page); display: grid; place-items: center; pointer-events: none; }
.drop .frame { border: 6px dashed var(--yellow); padding: 60px 90px; text-align: center; }
.drop p { color: #bbb; margin: 18px 0 0; }
#zoom { position: fixed; inset: 0; z-index: 60; background: var(--page); display: grid; place-items: center; cursor: zoom-out; }
#zoom img { max-width: 92vw; max-height: 86vh; image-rendering: pixelated; background: #000; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 18px; z-index: 70; font-weight: 600; }

/* ---- pairing */
.pair { max-width: 440px; margin: 14vh auto 0; text-align: center; padding: 0 20px; }
.pair .logo { height: 54px; margin-bottom: 34px; }
.pair .card { background: var(--bar); outline: 2px solid var(--line); padding: 30px 28px; }
.pair p { color: var(--dim); margin: 14px 0 0; }
.pair input { width: 100%; font: 800 36px ui-monospace, Menlo, monospace; letter-spacing: .45em; text-align: center; padding: 14px 0 14px .45em; background: var(--field); border: 0; outline: 2px solid transparent; color: #fff; margin: 20px 0 12px; }
.pair input:focus { outline-color: var(--yellow); }
.pair .err { color: var(--red); min-height: 1.5em; font-size: 14px; }
.pair .pb { width: 100%; }

@media (max-width: 800px) {
	.wrap { padding: 0; }
	.shell { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; height: 100vh; border: 0; }
	.snav { flex-direction: row; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 2px solid var(--line); }
	.snav .lbl, .snav .spacer, .snav .meter, .snav .links { display: none; }
	.snav button.f { width: auto; white-space: nowrap; border-left: 0; border-bottom: 4px solid transparent; }
	.snav button.f.on { border-bottom-color: var(--c, var(--yellow)); }
	.ct, .tb { padding-left: 16px; padding-right: 16px; }
	.cg { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 20px 12px; }
	.modal { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; width: 100vw; height: 100vh; }
	.modal .side { display: flex; overflow-x: auto; padding: 0; }
	.modal .side button { width: auto; border-left: 0; border-bottom: 4px solid transparent; }
	.modal .side button.on { border-bottom-color: var(--c); }
	.modal .side small { display: none; }
	.hhd { grid-template-columns: 1fr; }
	.cov { width: 220px; height: 220px; margin: -110px 0 0 -110px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<div id="trayc"></div>
<input type="file" id="fileIn" multiple accept=".gba,.gbc,.gb,.sav,.srm,.zip" hidden>
<input type="file" id="saveIn" accept=".sav,.srm" hidden>
<input type="file" id="coverIn" accept="image/*" hidden>

<script>
"use strict";
const $ = id => document.getElementById(id);
const HDR = { "X-Cozis": "1" };
const ROM_EXT = /\.(gba|gbc|gb)$/i, SAVE_EXT = /\.(sav|srm)$/i;
const SYS_ORDER = ["gba", "gbc", "gb"];
const SYS_REPO = { gb: "Nintendo_-_Game_Boy", gbc: "Nintendo_-_Game_Boy_Color", gba: "Nintendo_-_Game_Boy_Advance" };
const HH_STATIC = "https://hh3.gbdev.io/static";

let systems = [], games = [], status = null;
let page = "all", libFilter = "all", q = "", focusId = null, panel = null, renameDraft = null;
let uploads = [], addOpen = false, addSrc = "pc", hq = "", hhSys = "GBA", hhPick = null, hhEntry = null;
const hhCache = {}, itchCache = { list: null, err: null, loading: false };

// ------------------------------------------------------------ helpers
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pal = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const PX = (t, sc = 2, col = "#ffffff") => `<span class="px" data-scale="${sc}" data-color="${col}">${esc(String(t).toUpperCase())}</span>`;
function size(n) {
	if (n < 1024) return n + " B";
	const u = ["KB", "MB", "GB", "TB"]; let i = -1;
	do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
	return (n < 10 ? n.toFixed(1) : Math.round(n)) + " " + u[i];
}
const known = t => t > 978307200;	// before 2001: the console clock wasn't set
function ago(t) {
	if (!known(t)) return "date unknown";
	const s = Date.now() / 1000 - t, rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
	if (s < 60) return "just now";
	if (s < 3600) return rtf.format(-Math.round(s / 60), "minute");
	if (s < 86400) return rtf.format(-Math.round(s / 3600), "hour");
	if (s < 86400 * 30) return rtf.format(-Math.round(s / 86400), "day");
	return new Date(t * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
const initials = t => (t.match(/[A-Za-z0-9]+/g) || ["?"]).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const sysLabel = k => (systems.find(s => s.key === k) || {}).label || k.toUpperCase();
const lastPlayed = g => Math.max(g.save ? g.save.time : 0, g.last_state || 0);
const byTitle = (a, b) => a.title.localeCompare(b.title, undefined, { numeric: true });
function toast(msg) {
	let t = $("toast");
	if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.append(t); }
	t.textContent = msg; t.classList.remove("hidden");
	clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 3500);
}
async function api(method, path, body) {
	const r = await fetch("/api/" + path, { method, headers: HDR, body });
	if (r.status === 401) { showPair(); throw new Error("not connected"); }
	const j = (r.headers.get("content-type") || "").includes("json") ? await r.json() : null;
	if (!r.ok) throw new Error(j && j.error || r.statusText);
	return j;
}
const coverURL = g => g.cover ? `/api/games/${g.id}/cover?x=1&v=${g.cover}` : null;
const placeholder = (title, sys, scale) => `<div class="ph" style="--c:var(--sys-${sys})">${PX(initials(title), scale)}</div>`;
// Hold for 1 s to confirm (destructive actions, as on the console).
function holdButton(label, cls, action) {
	const id = "h" + Math.random().toString(36).slice(2);
	holdButton.actions[id] = action;
	return `<button id="${id}" class="pb hold ${cls}" title="Press and hold to confirm"><i class="fill"></i>${PX(label, 2)}</button>`;
}
holdButton.actions = {};
function wireHolds(root) {
	root.querySelectorAll(".pb.hold:not([data-w])").forEach(b => {
		b.dataset.w = 1;
		let t;
		const start = e => { e.preventDefault(); b.classList.add("holding"); t = setTimeout(() => { b.classList.remove("holding"); holdButton.actions[b.id]?.(); }, 1000); };
		const stop = () => { clearTimeout(t); b.classList.remove("holding"); };
		b.addEventListener("pointerdown", start);
		["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop));
		b.addEventListener("click", e => { if (e.detail === 0) toast("Hold the button to confirm"); });
	});
}
function paint(el) { renderPixelText(el); wireHolds(el); }

// ------------------------------------------------------------ pairing
// Pairing: over the USB cable the browser is trusted and pairs by itself;
// over Wi-Fi the console shows the code on its screen while this page is open.
async function requestPair() {
	try {
		const r = await (await fetch("/api/pair/request", { method: "POST", headers: HDR })).json();
		if (r.usb) {
			const p = await fetch("/api/pair", { method: "POST", headers: HDR, body: "usb" });
			if (p.ok) { clearInterval(showPair.t); boot(); return true; }
		}
	} catch { }
	return false;
}
async function showPair() {
	if (page !== "pair" && await requestPair()) return;
	clearInterval(showPair.t);
	showPair.t = setInterval(() => { if (page === "pair") requestPair(); else clearInterval(showPair.t); }, 60000);
	page = "pair";
	$("layer").innerHTML = ""; $("trayc").innerHTML = "";
	$("root").innerHTML = `<div class="pair"><img class="logo pix" src="/logo.png" alt="cozisboy">
		<div class="card">${PX("Connect", 4, pal("--yellow"))}
			<p>Your cozisboy is showing a 6-digit code on its screen now. Enter it here.</p>
			<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">
			<div class="err" id="pairErr"></div>
			<button class="pb go" id="pairBtn">${PX("Connect", 2)}</button></div></div>`;
	paint($("root"));
	const pair = async () => {
		const code = $("code").value.replace(/\D/g, "");
		if (code.length !== 6) { $("pairErr").textContent = "The code has 6 digits."; return; }
		$("pairBtn").disabled = true;
		const r = await fetch("/api/pair", { method: "POST", headers: HDR, body: code });
		$("pairBtn").disabled = false;
		if (r.ok) { clearInterval(showPair.t); boot(); }

async function toPNG(blob) {	// any image -> PNG (the library stores PNG)
	const bmp = await createImageBitmap(blob);
	const c = document.createElement("canvas");
	c.width = bmp.width; c.height = bmp.height;
	c.getContext("2d").drawImage(bmp, 0, 0);
	return await new Promise(ok => c.toBlob(ok, "image/png"));
}
async function fetchCover(g) {	// libretro-thumbnails, matched by the No-Intro name

async function findCovers() {

// ------------------------------------------------------------ uploads (tray)
function renderTray() {
	const T = $("trayc");
	if (!uploads.length || page === "pair") { T.innerHTML = ""; return; }
	const busy = uploads.filter(u => u.state === "up" || u.state === "wait").length;
	T.innerHTML = `<div class="tray"><div class="th">${PX(busy ? "Adding " + busy : "Done", 2)}<a onclick="uploads=uploads.filter(u=>u.state==='up'||u.state==='wait');renderTray()">✕</a></div>` +
		uploads.map(u => `<div class="row ${u.state === "bad" ? "bad" : ""}"><span>${esc(u.name)}</span><span>${esc(u.msg)}</span></div>
			<div class="segs" style="--c:${u.state === "ok" ? "var(--green)" : u.state === "bad" ? "var(--red)" : "var(--yellow)"}">${Array.from({ length: 8 }, (_, i) => `<i class="${(u.state === "bad" ? 1 : u.p) * 8 > i ? "on" : ""}"></i>`).join("")}</div>`).join("") + `</div>`;
	paint(T);
}
function putFile(url, blob, onprog) {
	return new Promise(res => {
		const x = new XMLHttpRequest();
		x.open("PUT", url); x.setRequestHeader("X-Cozis", "1");
		x.upload.onprogress = e => { if (e.lengthComputable) onprog(e.loaded / e.total); };
		x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch { } res({ status: x.status, j }); };
		x.onerror = () => res({ status: 0, j: { error: "connection lost" } });
		x.send(blob);
	});
}
let pumping = false;
function addFiles(list) {
	for (const f of list) uploads.push({ file: f, name: f.name, p: 0, state: "wait", msg: "waiting" });
	renderTray(); pump();
}
async function pump() {
	if (pumping) return;
	pumping = true;
	let u;
	while ((u = uploads.find(x => x.state === "wait"))) {
		u.state = "up"; u.msg = "0%"; renderTray();
		try { await handleFile(u); } catch (e) { u.state = "bad"; u.msg = e.message || "failed"; }
		renderTray();
	}
	pumping = false;
	await refresh();
	setTimeout(() => { if (!pumping) { uploads = uploads.filter(x => x.state !== "ok"); renderTray(); } }, 4000);
}
async function handleFile(u) {
	const f = u.file, name = f.name;
	if (/\.zip$/i.test(name)) {	// unpacked: the games and saves inside go in one by one
		u.msg = "unpacking"; renderTray();
		const files = await unzip(f, n => ROM_EXT.test(n) || SAVE_EXT.test(n));
		if (!files.length) throw new Error("no game or save in this zip");
		u.state = "ok"; u.p = 1; u.msg = `${files.length} file${files.length > 1 ? "s" : ""} inside`;
		// ROMs first, so saves in the same zip find their game
		files.sort((a, b) => SAVE_EXT.test(a.name) - SAVE_EXT.test(b.name));
		for (const x of files) uploads.push({ file: x, name: x.name, p: 0, state: "wait", msg: "waiting" });
		return;
	}
	if (SAVE_EXT.test(name)) {	// a save goes to the game with the same name (or the open game)
		await loadGames();
		const base = name.replace(SAVE_EXT, "").toLowerCase();
		const g = games.find(x => x.name.toLowerCase() === base) || games.find(x => x.title.toLowerCase() === base) || (page === "game" ? cur() : null);
		if (!g) throw new Error("no game with this name on the console");
		const r = await putFile(`/api/games/${g.id}/save`, f, p => { u.p = p; u.msg = Math.round(p * 100) + "%"; renderTray(); });
		if (r.status !== 200) throw new Error(r.j.error || "failed");
		u.state = "ok"; u.p = 1; u.msg = "save → " + g.title;
		return;
	}
	if (!ROM_EXT.test(name)) throw new Error("not a .gba, .gbc, .gb, .sav or .zip file");
	const t0 = performance.now();
	const url = rep => `/api/games?filename=${encodeURIComponent(name)}${rep ? "&replace=1" : ""}`;
	const prog = p => { u.p = p; const rate = f.size * p / Math.max(0.001, (performance.now() - t0) / 1000); u.msg = `${Math.round(p * 100)}% · ${size(rate)}/s`; renderTray(); };
	let r = await putFile(url(false), f, prog);
	if (r.status === 409) {
		if (!confirm(`"${name.replace(ROM_EXT, "")}" is already on the console. Replace the game file? Its saves and states stay.`)) { u.state = "bad"; u.msg = "already on the console"; return; }
		r = await putFile(url(true), f, prog);
	}
	if (r.status !== 200) throw new Error(r.j.error || "failed");
	u.p = 1; u.state = "ok"; u.msg = "added";
	if (!r.j.cover) { u.msg = "finding cover…"; renderTray(); await fetchCover(r.j); u.msg = "added"; }
}
// Minimal ZIP reader: stored and deflated entries (DecompressionStream).
async function unzip(file, want) {
	const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
	let eocd = -1;
	for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--)
		if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
	if (eocd < 0) throw new Error("not a zip file");
	const n = dv.getUint16(eocd + 10, true);
	let p = dv.getUint32(eocd + 16, true);
	const out = [], td = new TextDecoder();
	for (let k = 0; k < n; k++) {
		if (dv.getUint32(p, true) !== 0x02014b50) break;
		const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
		const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
		const loff = dv.getUint32(p + 42, true);
		const fname = td.decode(buf.subarray(p + 46, p + 46 + nlen));
		p += 46 + nlen + xlen + clen;
		const base = fname.split("/").pop();
		if (!base || base.startsWith(".") || fname.startsWith("__MACOSX/") || !want(base)) continue;
		const ds = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
		const data = buf.subarray(ds, ds + csize);
		let blob;
		if (method === 0) blob = new Blob([data]);
		else if (method === 8) blob = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
		else continue;
		out.push(new File([blob], base));
	}
	return out;
}

// readable cross-origin); ROMs and images are fetched from hh3.gbdev.io.
const hhFile = (e, f) => `${HH_STATIC}/${e.basepath}/entries/${encodeURIComponent(e.slug)}/${f.split("/").map(encodeURIComponent).join("/")}`;
const hhName = e => e.title.replace(/[\/\\\x00-\x1f\x7f]/g, "-").replace(/^[.\s]+|\s+$/g, "").slice(0, 200) || e.slug;
const devName = d => (Array.isArray(d) ? d : d ? [d] : []).map(x => typeof x === "string" ? x : (x && x.name) || "").filter(Boolean).join(", ");
const installed = e => games.some(g => g.name === hhName(e));
function hhRom(e) { const roms = (e.files || []).filter(f => ROM_EXT.test(f.filename)); return roms.find(f => f.default) || roms.find(f => f.playable) || roms[0]; }
async function loadHH(sys) {
	if (hhCache[sys]) return;
	const c = hhCache[sys] = { list: null, done: 0, total: 0, err: null };
	const pq = p => `hh/search?platform=${sys}&typetag=game&sort=title&order=asc&page=${p}`;
	try {
		const first = await api("GET", pq(1));
		let all = first.entries; c.total = first.results; c.done = all.length; c.partial = all;
		const pages = []; for (let p = 2; p <= first.page_total; p++) pages.push(p);
		while (pages.length) {
			// one page at a time: Homebrew Hub throttles parallel requests hard
			const res = [await api("GET", pq(pages.shift()))];
			res.forEach(r => all = all.concat(r.entries));
			c.done = all.length; c.partial = all;	// show games as they arrive
			if (addOpen && addSrc === "hh" && hhSys === sys && hhPick == null) updateHHGrid();
		}
		c.list = all.filter(e => !e.wip);
	} catch (err) { c.err = err.message; }
	if (addOpen && addSrc === "hh" && hhSys === sys && hhPick == null) updateHHGrid();
}
function hhCard(e, i) {
	const shot = e.screenshots && e.screenshots[0];
	return `<div class="it" tabindex="0" onclick="pickHH(${i})">
		<div class="fr shot">${shot ? `<img src="${esc(hhFile(e, shot))}" alt="" loading="lazy">` : placeholder(e.title, (e.platform || "GBA").toLowerCase(), 5)}
			${installed(e) ? `<div class="tg"><span class="ok">${PX("On console", 1.5, "#000000")}</span></div>` : `<button class="pb go small act" onclick="event.stopPropagation();installHH(${i})">${PX("Install", 2)}</button>`}</div>
		<div class="nm">${esc(e.title)}</div><div class="sb">${esc(e.platform)} · ${esc(devName(e.developer) || "unknown")}</div></div>`;
}
function hhGridHTML() {
	const c = hhCache[hhSys];
	if (c && c.err) return `<p class="note">Couldn't reach Homebrew Hub: ${esc(c.err)}. Is the cozisboy online?</p>`;
	const src = c && (c.list || c.partial && c.partial.filter(e => !e.wip));
	const more = !c || !c.list ? `<p class="loading">Loading ${hhSys} games from Homebrew Hub… ${c && c.total ? c.done + " of " + c.total : ""}</p>` : "";
	if (!src) return more;
	const list = src.filter(e => !hq || e.title.toLowerCase().includes(hq) || devName(e.developer).toLowerCase().includes(hq));
	return (list.length ? list.map(e => hhCard(e, src.indexOf(e))).join("") : c.list ? `<p class="note">No game matches.</p>` : "") + more;
}
function hhList() { const c = hhCache[hhSys]; return c.list || c.partial.filter(e => !e.wip); }
function updateHHGrid() { const g = $("hhgrid"); if (g) { g.innerHTML = hhGridHTML(); paint(g); } }
async function pickHH(i) {
	hhPick = i; hhEntry = null; renderPopup();
	$("layer").querySelector(".body").scrollTop = 0;
	const e = hhList()[i];
	try { hhEntry = await api("GET", `hh/entry/${encodeURIComponent(e.slug)}.json`); } catch { hhEntry = e; }
	if (hhPick === i) renderPopup();
}
async function installHH(i) {
	const e0 = hhList()[i];
	const u = { name: e0.title, p: 0, state: "up", msg: "downloading" };
	uploads.push(u); renderTray();
	try {
		const e = (hhEntry && hhEntry.slug === e0.slug) ? hhEntry : await api("GET", `hh/entry/${encodeURIComponent(e0.slug)}.json`);
		const rom = hhRom(e);
		if (!rom) throw new Error("no playable file for this console");
		const r = await fetch(hhFile(e, rom.filename));
		if (!r.ok) throw new Error("download failed (" + r.status + ")");
		const data = await r.blob();
		const ext = rom.filename.match(ROM_EXT)[1].toLowerCase();
		u.msg = "installing"; renderTray();
		const res = await putFile(`/api/games?filename=${encodeURIComponent(hhName(e) + "." + ext)}`, data, p => { u.p = p; renderTray(); });
		if (res.status !== 200) throw new Error(res.j.error || "failed");
		const shot = e.screenshots && e.screenshots[0];
		if (shot) try { await api("PUT", `games/${res.j.id}/cover`, await toPNG(await (await fetch(hhFile(e, shot))).blob())); } catch { }
		u.state = "ok"; u.p = 1; u.msg = "installed";
	} catch (err) { u.state = "bad"; u.msg = err.message; }
	renderTray();
	await refresh();
}
// itch.io: its public tag feeds are readable from the browser; downloads are not.
async function loadItch() {
	if (itchCache.list || itchCache.loading) return;
	itchCache.loading = true; itchCache.err = null;
	try {
		const out = [];
		for (const [tag, plat] of [["gameboy-advance", "GBA"], ["gameboy", "GB"]]) {
			const r = await fetch(`https://itch.io/games/free/tag-${tag}.xml`);
			if (!r.ok) throw new Error(r.status === 429 ? "itch.io is limiting requests right now. Try again in a few minutes." : "itch.io answered " + r.status + ".");
			const x = new DOMParser().parseFromString(await r.text(), "text/xml");
			for (const it of x.querySelectorAll("item")) {
				const tx = s => (it.querySelector(s) || {}).textContent || "";
				const link = tx("link");
				out.push({ title: tx("plainTitle") || tx("title"), img: tx("imageurl"), link, author: (link.match(/^https:\/\/([^.]+)\.itch\.io/) || [])[1] || "", platform: plat });
			}
		}
		itchCache.list = out;
	} catch (err) { itchCache.err = err.message; }
	itchCache.loading = false;
	if (addOpen && addSrc === "itch") renderPopup();
}
function popupBody() {
	if (addSrc === "pc")
		return `<div class="dropzone">${PX("Drop files here", 4)}
			<p>.gba  .gbc  .gb  ·  .sav saves go to the game with the same name  ·  .zip is unpacked for you</p>
			<button class="pb go" onclick="$('fileIn').click()">${PX("Choose files", 2)}</button></div>
			<p class="note">You can drop files anywhere on the page, even with this window closed.</p>`;
	if (addSrc === "hh" && hhPick != null) {
		const e = hhEntry || hhList()[hhPick], have = installed(e);
		const shots = (e.screenshots || []).map(f => `<img src="${esc(hhFile(e, f))}" alt="">`).join("");
		return `<button class="pb dim small" onclick="hhPick=null;renderPopup()" style="margin-bottom:18px">${PX("< Back", 2)}</button>
			<div class="hhd"><div class="shots">${shots}</div>
			<div>${PX(e.title, e.title.length > 20 ? 3 : 4, pal(`--sys-${(e.platform || "GBA").toLowerCase()}`))}
				<p class="note" style="margin-top:10px">${esc(e.platform)} · by ${esc(devName(e.developer) || "unknown")}${e.date ? " · " + esc(String(e.date).slice(0, 4)) : ""}</p>
				<div class="desc">${esc(e.description || (hhEntry ? "No description." : "Loading…"))}</div>
				${have ? PX("On your console", 2, pal("--green")) : `<button class="pb go" onclick="installHH(${hhPick})">${PX("+ Install", 3)}</button>`}
				<p class="note"><a href="https://hh.gbdev.io/game/${encodeURIComponent(e.slug)}" target="_blank" rel="noopener">View on Homebrew Hub</a></p></div></div>`;
	}
	if (addSrc === "hh") {
		loadHH(hhSys);
		return `<div class="ctl"><input class="search" id="hq" placeholder="Search Homebrew Hub" value="${esc(hq)}">
			<div class="chips">${["GBA", "GBC", "GB"].map(f => `<button class="chip ${hhSys === f ? "on" : ""}" onclick="hhSys='${f}';renderPopup()">${PX(f, 2, hhSys === f ? "#000000" : "#cccccc")}</button>`).join("")}</div></div>
			<div class="cg" id="hhgrid" style="margin-top:22px">${hhGridHTML()}</div>`;
	}
	if (addSrc === "itch") {
		loadItch();
		const grid = itchCache.err ? `<p class="note">${esc(itchCache.err)}</p>`
			: !itchCache.list ? `<p class="loading">Loading free Game Boy games from itch.io…</p>`
			: itchCache.list.map(e => `<div class="it"><a href="${esc(e.link)}" target="_blank" rel="noopener" style="text-decoration:none">
				<div class="fr shot">${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy">` : placeholder(e.title, e.platform.toLowerCase(), 5)}</div>
				<div class="nm">${esc(e.title)}</div><div class="sb">${esc(e.platform)} · ${esc(e.author)}</div></a></div>`).join("");
		return `<p class="note" style="margin-top:0">itch.io has no download API: click a game to open its page, download it there (often a .zip), then drop the file anywhere on this page.</p>
			<div class="cg" style="margin-top:22px">${grid}</div>`;
	}
	return `<p class="note" style="margin-top:0">A direct link to a .gba, .gbc or .gb file. The console downloads it itself (up to 64 MB). For a .zip, download it here and drop it on the page.</p>
		<div class="linkrow"><input class="search" id="url" placeholder="https://example.com/My Game (USA).gba" onkeydown="if(event.key==='Enter')fetchLink()"><button class="pb go" onclick="fetchLink()">${PX("Download to console", 2)}</button></div>`;
}
async function fetchLink() {
	const url = $("url").value.trim();
	if (!/^https?:\/\//i.test(url)) { toast("Paste an http(s) link."); return; }
	let name = url.split(/[?#]/)[0].split("/").pop() || url;
	try { name = decodeURIComponent(name); } catch { }
	const u = { name, p: 0.15, state: "up", msg: "the console is downloading" };
	uploads.push(u); renderTray();
	try {
		const r = await api("POST", `games/fetch?url=${encodeURIComponent(url)}`);
		u.state = "ok"; u.p = 1; u.msg = "added";
		if (!r.cover) await fetchCover(r);
		if ($("url")) $("url").value = "";
	} catch (e) { u.state = "bad"; u.msg = e.message; }
	renderTray(); await refresh();
}
// The popup lives in its own layer: updates keep its scroll position and
// focus, and the opening animation only plays when it opens.
function renderPopup(opening) {
	const L = $("layer");
	if (!addOpen || page === "pair") { L.innerHTML = ""; return; }
	if (!opening && L.querySelector(".modal")) {
		const body = L.querySelector(".body"), top = body.scrollTop;
		const focused = document.activeElement && document.activeElement.id;
		L.querySelector(".side").innerHTML = popupSide();
		body.innerHTML = popupBody();
		body.scrollTop = top;
		const el = focused && $(focused);
		if (el && el.tagName === "INPUT") { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
	} else {
		L.innerHTML = `<div class="modal-bg anim" onclick="if(event.target===this)closeAdd()"><div class="modal anim" role="dialog" aria-label="Add games">
			<div class="mh">${PX("Add games", 4, pal("--yellow"))}<button class="pb dim small" onclick="closeAdd()">${PX("Esc", 2)}</button></div>
			<nav class="side">${popupSide()}</nav><div class="body">${popupBody()}</div></div></div>`;
	}
	paint(L);
}
document.addEventListener("input", e => {
	if (e.target.id === "hq") { hq = e.target.value.toLowerCase(); updateHHGrid(); }
	if (e.target.id === "q") { q = e.target.value.toLowerCase(); $("ct").innerHTML = contentHTML(); paint($("ct")); }
	if (e.target.id === "rn") renameDraft = e.target.value;
});
$("fileIn").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };

// ------------------------------------------------------------ drag and drop, keys, wheel
let dragDepth = 0;
function dropLayer(on) {
	let d = document.querySelector(".drop");
	if (on && !d) {
		d = document.createElement("div"); d.className = "drop";
		d.innerHTML = `<div class="frame">${PX(page === "game" ? "Drop here" : "Drop to add", 6, pal("--yellow"))}<p>${page === "game" ? "A .sav replaces this game's save (the old one is kept) · games are added" : ".gba  .gbc  .gb  ·  .sav  ·  .zip"}</p></div>`;
		document.body.append(d); paint(d);
	} else if (!on && d) d.remove();
}
document.addEventListener("dragenter", e => { if (page === "pair" || !e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return; e.preventDefault(); dragDepth++; dropLayer(true); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; dropLayer(false); } });
document.addEventListener("drop", e => {
	e.preventDefault(); dragDepth = 0; dropLayer(false);
	const files = [...(e.dataTransfer && e.dataTransfer.files || [])];
	if (!files.length || page === "pair") return;
	if (page === "game" && files.length === 1 && SAVE_EXT.test(files[0].name)) { replaceSave(files[0]); return; }
	addFiles(files);
});
document.addEventListener("keydown", e => {
	if ($("zoom")) { if (e.key === "Escape") $("zoom").remove(); return; }
	if (addOpen && e.key === "Escape") { if (hhPick != null) { hhPick = null; renderPopup(); } else closeAdd(); return; }
	if (page !== "game" || addOpen || e.target.tagName === "INPUT") return;
	if (e.key === "ArrowRight") { move(1); e.preventDefault(); }
	if (e.key === "ArrowLeft") { move(-1); e.preventDefault(); }
	if (e.key === "Escape") closeGame();
});
let wheelT = 0;
document.addEventListener("wheel", e => {
	if (page !== "game" || addOpen || e.target.closest(".info")) return;
	const now = performance.now(), d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
	if (now - wheelT < 160 || Math.abs(d) < 4) return;
	wheelT = now; move(d > 0 ? 1 : -1);
}, { passive: true });

// ------------------------------------------------------------ shell
function render() {
	if (page === "pair") return;
	$("root").innerHTML = page === "game" ? pageGame() : pageAll();
	paint($("root"));
	renderTray();
}
async function logout() { await api("POST", "logout"); showPair(); }
async function boot() {
	try { await Promise.all([loadGames(), loadStatus()]); } catch { return; }
	page = "all"; render();
	clearInterval(boot.t);
	boot.t = setInterval(async () => {	// battery and storage, and games changed on the console
		try {
			const before = JSON.stringify(games);
			await Promise.all([loadStatus(), loadGames()]);
			const stat = document.querySelector(".hd .stat");
			if (stat) { stat.innerHTML = statusHTML(); paint(stat); }
			if (page === "all" && JSON.stringify(games) !== before && document.activeElement?.id !== "q") { $("ct").innerHTML = contentHTML(); paint($("ct")); }
		} catch { }
	}, 15000);
}
boot();
</script>
